services:
  server_frontend:
    build: .
    container_name: server_frontend
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/model_dashboard.sqlite
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
